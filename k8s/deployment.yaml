apiVersion: apps/v1
kind: Deployment
metadata:
  name: devraq-oras-skopeo-api
  namespace: thinkcloud
  labels:
    app: devraq-oras-skopeo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devraq-oras-skopeo-api
  template:
    metadata:
      labels:
        app: devraq-oras-skopeo-api
    spec:
      containers:
        - name: devraq-oras-skopeo-api
          image: docker.io/library/devraq-oras-skopeo-api:1.0.0
          # Image is loaded locally on the node via `ctr images import` (no registry push) — never pull.
          imagePullPolicy: Never
          ports:
            - containerPort: 8009
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            # push/pull endpoints read & write files under /library/harbor/* by default
            # (source_path, file_path, dest_dir) — shares the same PVC as backend/frontend.
            - name: library-storage
              mountPath: /library
      volumes:
        - name: library-storage
          persistentVolumeClaim:
            claimName: library-pvc
