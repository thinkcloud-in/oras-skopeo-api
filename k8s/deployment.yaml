apiVersion: apps/v1
kind: Deployment
metadata:
  name: devraq-oras-skopeo-api
  namespace: default
  labels:
    app: devraq-oras-skopeo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devraq-oras-skopeo-api
  template:
    metadata:
      labels:
        app: devraq-oras-skopeo-api
    spec:
      containers:
        - name: devraq-oras-skopeo-api
          image: devraq-oras-skopeo-api:1.0.0
          # Image is loaded locally on the node via `docker load` (no registry push) — never pull.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            # push/pull endpoints read & write files under /library/harbor/* by default
            # (source_path, file_path, dest_dir) — this must be the same shared path
            # other services on the host use to drop/collect those files.
            - name: harbor-data
              mountPath: /library/harbor
      volumes:
        - name: harbor-data
          hostPath:
            path: /library/harbor
            type: DirectoryOrCreate
