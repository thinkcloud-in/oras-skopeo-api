apiVersion: apps/v1
kind: Deployment
metadata:
  name: devraq-oras-skopeo-api
  namespace: thinkcloud
  labels:
    app: devraq-oras-skopeo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devraq-oras-skopeo-api
  template:
    metadata:
      labels:
        app: devraq-oras-skopeo-api
    spec:
      containers:
        - name: devraq-oras-skopeo-api
          image: docker.io/library/devraq-oras-skopeo-api:1.0.0
          # Image is loaded locally on the node via `ctr images import` (no registry push) — never pull.
          imagePullPolicy: Never
          ports:
            - containerPort: 8009
          # Guacamole DB connection for /guacamole/logs/delete — caller never
          # passes credentials, they come from the pod's own env only.
          # NOTE: verify GUAC_DB_HOST matches the actual Postgres Service name
          # in the thinkcloud namespace (see daas_v1/database/*.yaml).
          env:
            - name: GUAC_DB_HOST
              value: "postgres"
            - name: GUAC_DB_PORT
              value: "5432"
            - name: GUAC_DB_NAME
              value: "guacamole"
            - name: GUAC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: devraq-postgres-secret
                  key: username
            - name: GUAC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devraq-postgres-secret
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            # push/pull endpoints read & write files under /library/harbor/* by default
            # (source_path, file_path, dest_dir) — shares the same PVC as backend/frontend.
            - name: library-storage
              mountPath: /library
            # guacamole/recordings/delete needs the same recordings volume Guacamole writes to.
            - name: recordings-vol
              mountPath: /recordings
      volumes:
        - name: library-storage
          persistentVolumeClaim:
            claimName: library-pvc
        - name: recordings-vol
          persistentVolumeClaim:
            claimName: guacamole-recordings-pvc
